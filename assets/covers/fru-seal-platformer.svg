    <rect x="56" y="140" width="2" height="2"/>
    <rect x="56" y="140" width="2" height="2"/>
    <rect x="60" y="140" width="2" height="2"/>
    <rect x="64" y="140" width="2" height="2"/>
    <rect x="68" y="140" width="2" height="2"/>
    <rect x="72" y="140" width="2" height="2"/>
