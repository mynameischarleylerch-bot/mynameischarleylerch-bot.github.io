  <defs>
    <!-- 8-bit Aero palette -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="25%" stop-color="#0088FF"/>
      <stop offset="50%" stop-color="#44AAFF"/>
      <stop offset="75%" stop-color="#88CCFF"/>
      <stop offset="100%" stop-color="#CCEEFF"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.85" cy="0.15" r="0.5">
      <stop offset="0%" stop-color="#FFCC00"/>
      <stop offset="60%" stop-color="#FFEE44"/>
      <stop offset="100%" stop-color="#FFFF88"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#004488"/>
      <stop offset="50%" stop-color="#0066AA"/>
      <stop offset="100%" stop-color="#0088CC"/>
    </linearGradient>
    <linearGradient id="seal-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#002244"/>
      <stop offset="50%" stop-color="#004466"/>
      <stop offset="100%" stop-color="#006688"/>
    </linearGradient>
    <linearGradient id="seal-belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#FFEE44"/>
    </linearGradient>
    <linearGradient id="glass-platform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CCEEFF"/>
      <stop offset="50%" stop-color="#88CCEE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="bubble-platform" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#44AAFF"/>
      <stop offset="70%" stop-color="#88CCFF"/>
      <stop offset="100%" stop-color="#CCEEFF"/>
    </radialGradient>
    <linearGradient id="goal-platform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFCC00"/>
      <stop offset="50%" stop-color="#FFEE44"/>
      <stop offset="100%" stop-color="#FFFF88"/>
    </linearGradient>
    <radialGradient id="bubble-collect" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#88CCFF"/>
      <stop offset="50%" stop-color="#CCEEFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </radialGradient>
    <radialGradient id="pearl-collect" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#FFFFCC"/>
      <stop offset="50%" stop-color="#FFFF88"/>
      <stop offset="100%" stop-color="#FFFFAA"/>
    </radialGradient>
    <radialGradient id="urchin-body" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#440044"/>
      <stop offset="50%" stop-color="#660066"/>
      <stop offset="100%" stop-color="#880088"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="180" fill="url(#sky)"/>

  <!-- Sun with 8-bit rays -->
  <g transform="translate(272, 27)">
    <g stroke="#FFEE44" stroke-width="2">
      <line x1="0" y1="-30" x2="0" y2="-45"/>
      <line x1="21" y1="-21" x2="32" y2="-32"/>
      <line x1="30" y1="0" x2="45" y2="0"/>
      <line x1="21" y1="21" x2="32" y2="32"/>
      <line x1="0" y1="30" x2="0" y2="45"/>
      <line x1="-21" y1="21" x2="-32" y2="32"/>
      <line x1="-30" y1="0" x2="-45" y2="0"/>
      <line x1="-21" y1="-21" x2="-32" y2="-32"/>
    </g>
    <circle cx="0" cy="0" r="20" fill="#FFCC00"/>
    <circle cx="0" cy="0" r="12" fill="#FFEE44"/>
    <circle cx="0" cy="0" r="6" fill="#FFFF88"/>
  </g>

  <!-- Far hills -->
  <path d="M-20,130 Q80,110 180,120 Q280,130 340,120 L340,180 L-20,180 Z" fill="#0066CC"/>
  <path d="M-20,145 Q90,125 200,135 Q310,145 340,135 L340,180 L-20,180 Z" fill="#0088FF"/>
  <path d="M-20,160 Q100,140 220,150 Q340,160 340,150 L340,180 L-20,180 Z" fill="#44AAFF"/>

