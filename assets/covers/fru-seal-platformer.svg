  <!-- Platforms -->
  <!-- Glass platform left -->
  <rect x="40" y="100" width="100" height="14" rx="4" fill="#CCEEFF" stroke="#FFFFFF" stroke-width="1"/>
  <rect x="40" y="100" width="100" height="3" rx="4" fill="#88CCEE"/>

  <!-- Bubble platform middle -->
