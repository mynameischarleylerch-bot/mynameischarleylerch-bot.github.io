  <!-- Glass platform right -->
  <rect x="200" y="50" width="80" height="12" rx="4" fill="#CCEEFF" stroke="#FFFFFF" stroke-width="1"/>
  <rect x="200" y="50" width="80" height="3" rx="4" fill="#88CCEE"/>

  <!-- Goal platform top right (flashing) -->
  <rect x="260" y="25" width="45" height="14" rx="4" fill="#FFCC00" stroke="#FFFF88" stroke-width="2"/>
  <rect x="260" y="25" width="45" height="3" rx="4" fill="#FFEE44"/>

  <!-- Collectibles -->
  <!-- Bubble collectible -->
  <circle cx="70" cy="85" r="10" fill="#88CCFF"/>
  <circle cx="67" cy="82" r="3" fill="#CCEEFF"/>

  <!-- Pearl collectible -->
  <circle cx="210" cy="62" r="9" fill="#FFFFCC"/>
  <circle cx="210" cy="62" r="12" fill="#FFFF88" fill-opacity="0.5"/>
  <circle cx="208" cy="60" r="2" fill="#FFFFAA"/>

  <!-- Seal character (8-bit Messenger blob style from Frutiger Angler) -->
  <g transform="translate(140, 110) scale(1.5)">
    <!-- Main body blob (head merged into body with shoulder lobes) -->
    <path d="M0,20 C-18,20 -22,10 -22,0 C-22,-8 -14,-12 0,-12 C14,-12 22,-8 22,0 C22,10 18,20 0,20 Z" fill="#004466"/>
    <!-- Body highlight -->
    <path d="M-2,16 C-10,16 -14,6 -14,-2 C-14,-6 -8,-8 0,-8 C8,-8 14,-6 14,-2 C14,6 10,16 2,16 Z" fill="#006688"/>
    <!-- Belly -->
    <ellipse cx="0" cy="14" rx="10" ry="6" fill="#FFCC00"/>
    <!-- Face (on right side) -->
    <!-- Eye -->
    <rect x="-2" y="-6" width="4" height="4" fill="#002244"/>
    <rect x="-1" y="-5" width="1" height="1" fill="#FFFFFF"/>
    <!-- Nose/snout -->
    <rect x="10" y="0" width="2" height="2" fill="#002244"/>
    <!-- Front flipper -->
    <ellipse cx="4" cy="14" rx="6" ry="3" fill="#002244" transform="rotate(-15 4 14)"/>
    <!-- Back flipper -->
    <ellipse cx="-10" cy="12" rx="4" ry="2" fill="#002244" transform="rotate(10 -10 12)"/>
    <!-- Whiskers -->
    <g stroke="#002244" stroke-width="1" fill="none">
      <line x1="8" y1="-2" x2="14" y2="-4"/>
      <line x1="8" y1="2" x2="14" y2="4"/>
    </g>
  </g>

  <!-- Background bubbles -->
  <g fill="#44AAFF" opacity="0.5">
    <circle cx="30" cy="40" r="6"/>
    <circle cx="280" cy="60" r="4"/>
    <circle cx="50" cy="120" r="5"/>
    <circle cx="290" cy="140" r="3"/>
    <circle cx="100" cy="30" r="4"/>
    <circle cx="240" cy="110" r="5"/>
