<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 128" width="512" height="128" role="img" aria-label="Seal sprite sheet for Frutiger Aero Seal Platformer">
  <title>Frutiger Aero Seal Sprite Sheet</title>
  <defs>
    <!-- Frutiger Aero color palette via CSS variables -->
    <linearGradient id="seal-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--glass-top, rgba(255,255,255,0.62))"/>
      <stop offset="45%" stop-color="var(--sky-mid, #7fc4e8)"/>
      <stop offset="100%" stop-color="var(--deep, #01579b)"/>
    </linearGradient>
    <linearGradient id="seal-belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--sun, #fff9c4)"/>
      <stop offset="100%" stop-color="var(--sun-core, rgba(255,255,255,0.95))"/>
    </linearGradient>
    <radialGradient id="seal-sheen" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0%" stop-color="rgba(255,255,255,0.9)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="seal-eye-glint" cx="0.35" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="rgba(255,255,255,1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="seal-flipper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--sky-floor, #4aa8d8)"/>
      <stop offset="100%" stop-color="var(--deep, #01579b)"/>
    </linearGradient>
    <filter id="seal-glass" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="seal-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Each frame is 64x64, arranged in a 8x2 grid (512x128) -->
  <!-- Row 1: idle-1, idle-2, run-1, run-2, run-3, run-4, jump, swim-1 -->
  <!-- Row 2: swim-2, hurt, (spare frames) -->

  <!-- idle-1 (0, 0) - standing, gentle breathing -->
  <symbol id="idle-1" viewBox="0 0 64 64" overflow="visible">
    <!-- Body -->
    <ellipse cx="32" cy="42" rx="24" ry="18" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="32" cy="42" rx="22" ry="16" fill="url(#seal-sheen)" opacity="0.4"/>
    <!-- Belly -->
    <ellipse cx="32" cy="50" rx="14" ry="10" fill="url(#seal-belly)"/>
    <!-- Head -->
    <ellipse cx="48" cy="30" rx="14" ry="12" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="48" cy="30" rx="12" ry="10" fill="url(#seal-sheen)" opacity="0.3"/>
    <!-- Snout -->
    <ellipse cx="58" cy="30" rx="8" ry="6" fill="url(#seal-body)"/>
    <ellipse cx="60" cy="29" rx="3" ry="2" fill="var(--ink-soft, #3d6b85)"/>
    <!-- Eye -->
    <circle cx="49" cy="27" r="3.5" fill="var(--deepest, #013a63)"/>
    <circle cx="50" cy="26" r="1.2" fill="url(#seal-eye-glint)"/>
    <!-- Front flipper -->
    <ellipse cx="22" cy="48" rx="10" ry="6" fill="url(#seal-flipper)"/>
    <!-- Back flipper -->
    <ellipse cx="12" cy="46" rx="8" ry="5" fill="url(#seal-flipper)"/>
    <!-- Whiskers -->
    <g stroke="var(--ink-soft, #3d6b85)" stroke-width="0.6" fill="none">
      <path d="M55 29 Q59 27 62 26"/>
      <path d="M55 31 Q59 32 62 33"/>
    </g>
  </symbol>

  <!-- idle-2 (64, 0) - slight head tilt, blink -->
  <symbol id="idle-2" viewBox="0 0 64 64" overflow="visible">
    <ellipse cx="32" cy="42" rx="24" ry="18" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="32" cy="42" rx="22" ry="16" fill="url(#seal-sheen)" opacity="0.4"/>
    <ellipse cx="32" cy="50" rx="14" ry="10" fill="url(#seal-belly)"/>
    <ellipse cx="48" cy="30" rx="14" ry="12" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="48" cy="30" rx="12" ry="10" fill="url(#seal-sheen)" opacity="0.3"/>
    <ellipse cx="58" cy="30" rx="8" ry="6" fill="url(#seal-body)"/>
    <ellipse cx="60" cy="29" rx="3" ry="2" fill="var(--ink-soft, #3d6b85)"/>
    <!-- Eye - half closed for blink -->
    <ellipse cx="49" cy="27" rx="3.5" ry="1" fill="var(--deepest, #013a63)"/>
    <ellipse cx="22" cy="48" rx="10" ry="6" fill="url(#seal-flipper)"/>
    <ellipse cx="12" cy="46" rx="8" ry="5" fill="url(#seal-flipper)"/>
    <g stroke="var(--ink-soft, #3d6b85)" stroke-width="0.6" fill="none">
      <path d="M55 29 Q59 27 62 26"/>
      <path d="M55 31 Q59 32 62 33"/>
    </g>
  </symbol>

  <!-- run-1 (128, 0) - front flipper forward -->
  <symbol id="run-1" viewBox="0 0 64 64" overflow="visible">
    <ellipse cx="30" cy="42" rx="24" ry="18" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="30" cy="42" rx="22" ry="16" fill="url(#seal-sheen)" opacity="0.4"/>
    <ellipse cx="30" cy="50" rx="14" ry="10" fill="url(#seal-belly)"/>
    <ellipse cx="46" cy="28" rx="14" ry="12" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="46" cy="28" rx="12" ry="10" fill="url(#seal-sheen)" opacity="0.3"/>
    <ellipse cx="57" cy="28" rx="8" ry="6" fill="url(#seal-body)"/>
    <ellipse cx="59" cy="27" rx="3" ry="2" fill="var(--ink-soft, #3d6b85)"/>
    <circle cx="47" cy="25" r="3.5" fill="var(--deepest, #013a63)"/>
    <circle cx="48" cy="24" r="1.2" fill="url(#seal-eye-glint)"/>
    <!-- Front flipper extended forward -->
    <ellipse cx="38" cy="46" rx="12" ry="5" fill="url(#seal-flipper)" transform="rotate(-20 38 46)"/>
    <ellipse cx="8" cy="44" rx="8" ry="5" fill="url(#seal-flipper)"/>
    <g stroke="var(--ink-soft, #3d6b85)" stroke-width="0.6" fill="none">
      <path d="M53 27 Q58 24 61 23"/>
      <path d="M53 30 Q58 31 61 32"/>
    </g>
  </symbol>

  <!-- run-2 (192, 0) - back flipper pushing -->
  <symbol id="run-2" viewBox="0 0 64 64" overflow="visible">
    <ellipse cx="32" cy="42" rx="24" ry="18" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="32" cy="42" rx="22" ry="16" fill="url(#seal-sheen)" opacity="0.4"/>
    <ellipse cx="32" cy="50" rx="14" ry="10" fill="url(#seal-belly)"/>
    <ellipse cx="48" cy="30" rx="14" ry="12" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="48" cy="30" rx="12" ry="10" fill="url(#seal-sheen)" opacity="0.3"/>
    <ellipse cx="58" cy="30" rx="8" ry="6" fill="url(#seal-body)"/>
    <ellipse cx="60" cy="29" rx="3" ry="2" fill="var(--ink-soft, #3d6b85)"/>
    <circle cx="49" cy="27" r="3.5" fill="var(--deepest, #013a63)"/>
    <circle cx="50" cy="26" r="1.2" fill="url(#seal-eye-glint)"/>
    <ellipse cx="20" cy="48" rx="10" ry="6" fill="url(#seal-flipper)"/>
    <!-- Back flipper extended back for push -->
    <ellipse cx="14" cy="48" rx="12" ry="5" fill="url(#seal-flipper)" transform="rotate(25 14 48)"/>
    <g stroke="var(--ink-soft, #3d6b85)" stroke-width="0.6" fill="none">
      <path d="M55 29 Q59 27 62 26"/>
      <path d="M55 31 Q59 32 62 33"/>
    </g>
  </symbol>

  <!-- run-3 (256, 0) - body stretched, both flippers mid -->
  <symbol id="run-3" viewBox="0 0 64 64" overflow="visible">
    <ellipse cx="32" cy="42" rx="26" ry="16" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="32" cy="42" rx="24" ry="14" fill="url(#seal-sheen)" opacity="0.4"/>
    <ellipse cx="32" cy="50" rx="15" ry="9" fill="url(#seal-belly)"/>
    <ellipse cx="49" cy="28" rx="14" ry="12" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="49" cy="28" rx="12" ry="10" fill="url(#seal-sheen)" opacity="0.3"/>
    <ellipse cx="59" cy="28" rx="8" ry="6" fill="url(#seal-body)"/>
    <ellipse cx="61" cy="27" rx="3" ry="2" fill="var(--ink-soft, #3d6b85)"/>
    <circle cx="50" cy="25" r="3.5" fill="var(--deepest, #013a63)"/>
    <circle cx="51" cy="24" r="1.2" fill="url(#seal-eye-glint)"/>
    <ellipse cx="28" cy="46" rx="10" ry="5" fill="url(#seal-flipper)" transform="rotate(-15 28 46)"/>
    <ellipse cx="14" cy="46" rx="10" ry="5" fill="url(#seal-flipper)" transform="rotate(15 14 46)"/>
    <g stroke="var(--ink-soft, #3d6b85)" stroke-width="0.6" fill="none">
      <path d="M54 27 Q59 24 62 23"/>
      <path d="M54 30 Q59 31 62 32"/>
    </g>
  </symbol>

  <!-- run-4 (320, 0) - front flipper back, back flipper forward -->
  <symbol id="run-4" viewBox="0 0 64 64" overflow="visible">
    <ellipse cx="34" cy="42" rx="24" ry="18" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="34" cy="42" rx="22" ry="16" fill="url(#seal-sheen)" opacity="0.4"/>
    <ellipse cx="34" cy="50" rx="14" ry="10" fill="url(#seal-belly)"/>
    <ellipse cx="50" cy="30" rx="14" ry="12" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="50" cy="30" rx="12" ry="10" fill="url(#seal-sheen)" opacity="0.3"/>
    <ellipse cx="60" cy="30" rx="8" ry="6" fill="url(#seal-body)"/>
    <ellipse cx="62" cy="29" rx="3" ry="2" fill="var(--ink-soft, #3d6b85)"/>
    <circle cx="51" cy="27" r="3.5" fill="var(--deepest, #013a63)"/>
    <circle cx="52" cy="26" r="1.2" fill="url(#seal-eye-glint)"/>
    <ellipse cx="18" cy="48" rx="10" ry="6" fill="url(#seal-flipper)" transform="rotate(15 18 48)"/>
    <ellipse cx="26" cy="46" rx="10" ry="5" fill="url(#seal-flipper)" transform="rotate(-15 26 46)"/>
    <g stroke="var(--ink-soft, #3d6b85)" stroke-width="0.6" fill="none">
      <path d="M56 29 Q60 27 63 26"/>
      <path d="M56 31 Q60 32 63 33"/>
    </g>
  </symbol>

  <!-- jump (384, 0) - arched back, flippers tucked -->
  <symbol id="jump" viewBox="0 0 64 64" overflow="visible">
    <ellipse cx="32" cy="40" rx="22" ry="16" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="32" cy="40" rx="20" ry="14" fill="url(#seal-sheen)" opacity="0.5"/>
    <ellipse cx="32" cy="48" rx="13" ry="9" fill="url(#seal-belly)"/>
    <ellipse cx="48" cy="26" rx="13" ry="11" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="48" cy="26" rx="11" ry="9" fill="url(#seal-sheen)" opacity="0.4"/>
    <ellipse cx="58" cy="26" rx="7" ry="5" fill="url(#seal-body)"/>
    <ellipse cx="60" cy="25" rx="3" ry="2" fill="var(--ink-soft, #3d6b85)"/>
    <circle cx="49" cy="23" r="3.5" fill="var(--deepest, #013a63)"/>
    <circle cx="50" cy="22" r="1.2" fill="url(#seal-eye-glint)"/>
    <!-- Flippers tucked in -->
    <ellipse cx="20" cy="44" rx="8" ry="4" fill="url(#seal-flipper)"/>
    <ellipse cx="10" cy="42" rx="7" ry="4" fill="url(#seal-flipper)"/>
    <!-- Motion lines -->
    <g stroke="var(--sky-mid, #7fc4e8)" stroke-width="1.5" fill="none" opacity="0.6">
      <path d="M6 40 Q2 38 0 42"/>
      <path d="M6 46 Q2 50 0 48"/>
      <path d="M6 34 Q2 30 0 36"/>
    </g>
    <g stroke="var(--ink-soft, #3d6b85)" stroke-width="0.6" fill="none">
      <path d="M55 25 Q59 22 62 21"/>
      <path d="M55 28 Q59 29 62 30"/>
    </g>
  </symbol>

  <!-- swim-1 (448, 0) - horizontal swimming pose -->
  <symbol id="swim-1" viewBox="0 0 64 64" overflow="visible">
    <ellipse cx="32" cy="36" rx="28" ry="14" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="32" cy="36" rx="26" ry="12" fill="url(#seal-sheen)" opacity="0.5"/>
    <ellipse cx="32" cy="42" rx="16" ry="8" fill="url(#seal-belly)"/>
    <ellipse cx="54" cy="34" rx="12" ry="10" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="54" cy="34" rx="10" ry="8" fill="url(#seal-sheen)" opacity="0.3"/>
    <ellipse cx="62" cy="34" rx="7" ry="5" fill="url(#seal-body)"/>
    <ellipse cx="63" cy="33" rx="3" ry="2" fill="var(--ink-soft, #3d6b85)"/>
    <circle cx="55" cy="32" r="3.5" fill="var(--deepest, #013a63)"/>
    <circle cx="56" cy="31" r="1.2" fill="url(#seal-eye-glint)"/>
    <!-- Flippers spread for swimming -->
    <ellipse cx="26" cy="40" rx="14" ry="5" fill="url(#seal-flipper)" transform="rotate(-25 26 40)"/>
    <ellipse cx="18" cy="34" rx="12" ry="4" fill="url(#seal-flipper)" transform="rotate(-15 18 34)"/>
    <!-- Water bubbles -->
    <g fill="rgba(255,255,255,0.7)">
      <circle cx="68" cy="30" r="2" opacity="0.8"/>
      <circle cx="70" cy="38" r="1.5" opacity="0.6"/>
      <circle cx="74" cy="28" r="1" opacity="0.5"/>
    </g>
    <g stroke="var(--ink-soft, #3d6b85)" stroke-width="0.6" fill="none">
      <path d="M60 32 Q64 30 67 29"/>
      <path d="M60 35 Q64 36 67 37"/>
    </g>
  </symbol>

  <!-- swim-2 (0, 64) - alternate swim pose -->
  <symbol id="swim-2" viewBox="0 0 64 64" overflow="visible">
    <ellipse cx="32" cy="36" rx="28" ry="14" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="32" cy="36" rx="26" ry="12" fill="url(#seal-sheen)" opacity="0.5"/>
    <ellipse cx="32" cy="42" rx="16" ry="8" fill="url(#seal-belly)"/>
    <ellipse cx="54" cy="34" rx="12" ry="10" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="54" cy="34" rx="10" ry="8" fill="url(#seal-sheen)" opacity="0.3"/>
    <ellipse cx="62" cy="34" rx="7" ry="5" fill="url(#seal-body)"/>
    <ellipse cx="63" cy="33" rx="3" ry="2" fill="var(--ink-soft, #3d6b85)"/>
    <circle cx="55" cy="32" r="3.5" fill="var(--deepest, #013a63)"/>
    <circle cx="56" cy="31" r="1.2" fill="url(#seal-eye-glint)"/>
    <!-- Flippers in opposite phase -->
    <ellipse cx="26" cy="38" rx="14" ry="5" fill="url(#seal-flipper)" transform="rotate(-10 26 38)"/>
    <ellipse cx="18" cy="36" rx="12" ry="4" fill="url(#seal-flipper)" transform="rotate(-25 18 36)"/>
    <g fill="rgba(255,255,255,0.7)">
      <circle cx="68" cy="32" r="2" opacity="0.8"/>
      <circle cx="72" cy="36" r="1.5" opacity="0.6"/>
      <circle cx="70" cy="26" r="1" opacity="0.5"/>
    </g>
    <g stroke="var(--ink-soft, #3d6b85)" stroke-width="0.6" fill="none">
      <path d="M60 32 Q64 30 67 29"/>
      <path d="M60 35 Q64 36 67 37"/>
    </g>
  </symbol>

  <!-- hurt (64, 64) - X eyes, tilted -->
  <symbol id="hurt" viewBox="0 0 64 64" overflow="visible">
    <ellipse cx="32" cy="44" rx="24" ry="18" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="32" cy="44" rx="22" ry="16" fill="url(#seal-sheen)" opacity="0.3"/>
    <ellipse cx="32" cy="52" rx="14" ry="10" fill="url(#seal-belly)"/>
    <ellipse cx="46" cy="32" rx="14" ry="12" fill="url(#seal-body)" filter="url(#seal-glass)"/>
    <ellipse cx="46" cy="32" rx="12" ry="10" fill="url(#seal-sheen)" opacity="0.3"/>
    <ellipse cx="57" cy="32" rx="8" ry="6" fill="url(#seal-body)"/>
    <ellipse cx="59" cy="31" rx="3" ry="2" fill="var(--ink-soft, #3d6b85)"/>
    <!-- X eyes -->
    <g stroke="#e53935" stroke-width="2" stroke-linecap="round">
      <line x1="46" y1="28" x2="50" y2="32"/>
      <line x1="50" y1="28" x2="46" y2="32"/>
    </g>
    <ellipse cx="22" cy="50" rx="10" ry="6" fill="url(#seal-flipper)"/>
    <ellipse cx="12" cy="48" rx="8" ry="5" fill="url(#seal-flipper)"/>
    <!-- Dizzy stars -->
    <g fill="#fff9c4" stroke="#f9a825" stroke-width="0.5">
      <polygon points="40,18 41,21 44,21 41.5,23 42.5,26 40,24 37.5,26 38.5,23 36,21 39,21" transform="rotate(-15 40 22)" opacity="0.9"/>
      <polygon points="52,20 53,23 56,23 53.5,25 54.5,28 52,26 49.5,28 50.5,25 48,23 51,23" transform="rotate(10 52 24)" opacity="0.7"/>
      <polygon points="32,16 33,19 36,19 33.5,21 34.5,24 32,22 29.5,24 30.5,21 28,19 31,19" transform="rotate(20 32 20)" opacity="0.8"/>
    </g>
  </symbol>
</svg>