<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2040 — Frutiger Aero</title>
<style>
  :root {
    --deep: #01579b;
    --deepest: #013a63;
    --ink-soft: #3d6b85;
    --on-accent: #ffffff;

    --sky-top: #b3e5fc;
    --sky-mid: #7fc4e8;
    --sky-floor: #4aa8d8;
    --sun: #fff9c4;
    --sun-core: rgba(255, 255, 255, 0.95);
    --haze-tint: rgba(255, 255, 255, 0.75);

    --wood: #a9714a;
    --wood-deep: #7d4f2e;

    --glass-top: rgba(255, 255, 255, 0.62);
    --glass-mid: rgba(255, 255, 255, 0.3);
    --glass-bot: rgba(255, 255, 255, 0.16);
    --glass: linear-gradient(180deg, var(--glass-top), var(--glass-mid) 55%, var(--glass-bot));

    --sheen: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.5));
    --sheen-faint: linear-gradient(180deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0));
    --gloss-strength: 0.9;

    --hairline: rgba(255, 255, 255, 0.85);
    --hairline-strong: rgba(255, 255, 255, 0.92);
    --radius: 12px;
    --pill: 999px;
    --radius-lg: 18px;

    --shadow-card: 0 6px 16px rgba(1, 87, 155, 0.22), inset 0 1px 0 var(--hairline-strong);
    --shadow-panel: 0 18px 40px rgba(1, 87, 155, 0.22), inset 0 1px 0 var(--hairline);
    --shadow-edge: inset 0 -1px 0 rgba(255, 255, 255, 0.5);
    --shadow-lift: 0 10px 22px rgba(1, 87, 155, 0.28), inset 0 1px 0 #fff;

    --shine: linear-gradient(180deg, #fff, rgba(255, 255, 255, 0.45));
    --shine-on: linear-gradient(180deg, #81d4fa, #0288d1);
    --lime: #a3e635;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --move-duration: 120ms;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: linear-gradient(180deg, #e1f5fe, #b3e5fc 55%, #f4fbff);
    color: var(--deep);
    font: 16px "Segoe UI", Frutiger, system-ui, sans-serif;
    overflow: hidden;
  }

  .stage {
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: .6rem;
    padding: .75rem;
  }

  .hud {
    display: flex; align-items: center; justify-content: space-between; gap: .5rem;
    flex-wrap: wrap;
    padding: .4rem .9rem; border-radius: var(--pill);
    background: var(--glass);
    border: 1px solid var(--hairline-strong);
    box-shadow: var(--shadow-card);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .hud__group {
    display: inline-flex; align-items: center; gap: .35rem;
    padding: .18rem .55rem; min-height: 2.1rem; box-sizing: border-box;
    border-radius: var(--pill);
    background: linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.62));
    border: 1px solid rgba(255, 255, 255, .95);
    box-shadow: inset 0 1px 0 #fff, 0 2px 6px rgba(1, 87, 155, .12);
  }
  .hud__group b { color: var(--deep); font-size: 1.2em; }

  .hud b { font-variant-numeric: tabular-nums; }
  .hud__dim { color: var(--ink-soft); }

  .board-wrap {
    display: grid; place-items: center; min-height: 0;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: .75rem;
    width: min(90vmin, 460px);
    aspect-ratio: 1;
    padding: .75rem;
    border-radius: var(--radius-lg);
    background:
      linear-gradient(105deg, rgba(255,255,255,0) 38%, rgba(255,255,255,.22) 50%, rgba(255,255,255,0) 62%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 42%, var(--sky-floor) 100%);
    border: 1px solid var(--hairline-strong);
    box-shadow: var(--shadow-panel), var(--shadow-edge);
    position: relative;
    overflow: hidden;
  }

  .board::before {
    content: ""; position: absolute; right: 6%; top: 4%;
    width: 24%; height: 30%;
    border-radius: 28% 34% 32% 30% / 34% 30% 32% 28%;
    background: radial-gradient(ellipse at 50% 50%, var(--sun), rgba(255, 249, 196, 0) 72%);
    box-shadow: 0 0 40px rgba(255, 249, 196, .55);
    pointer-events: none;
  }

  .board::after {
    content: ""; position: absolute; left: -5%; right: -5%; top: 22%; height: 28%;
    pointer-events: none;
    background:
      radial-gradient(50% 100% at 62% 30%, rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 70%),
      radial-gradient(60% 100% at 20% 60%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 70%);
    opacity: .85;
    animation: sheen-drift 14s ease-in-out infinite alternate;
  }
  @keyframes sheen-drift {
    from { transform: translateX(-3%); }
    to   { transform: translateX(3%); }
  }

  .cell {
    position: relative;
    border-radius: var(--radius);
    background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,.1));
    border: 1px solid rgba(255,255,255,.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
  }

  .tile {
    position: absolute;
    inset: 0;
    display: grid; place-items: center;
    border-radius: var(--radius);
    font-weight: 800; font-size: clamp(1.6rem, 6vmin, 3.2rem);
    color: var(--deep);
    transition: transform var(--move-duration) var(--ease), opacity var(--move-duration) var(--ease);
    transform: scale(1);
    will-change: transform, opacity;
    z-index: 1;
    background: var(--shine);
    border: 1px solid rgba(255,255,255,.5);
    box-shadow: inset 0 1px 0 #fff, 0 2px 6px rgba(1,87,155,.15);
  }
  .tile--new { animation: tile-pop 180ms var(--ease); }
  .tile--merged { animation: tile-merge 140ms var(--ease); }
  .tile--merged-from { animation: tile-merge-from 140ms var(--ease) forwards; }
  @keyframes tile-pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes tile-merge { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes tile-merge-from { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.8); opacity: 0; } }

  /* Tile colors — Aero palette */
  .tile[data-v="2"]   { background: linear-gradient(180deg, #e1f5fe, #b3e5fc); color: var(--deep); }
  .tile[data-v="4"]   { background: linear-gradient(180deg, #b3e5fc, #81d4fa); color: var(--deep); }
  .tile[data-v="8"]   { background: linear-gradient(180deg, #81d4fa, #4fc3f7); color: #fff; }
  .tile[data-v="16"]  { background: linear-gradient(180deg, #4fc3f7, #29b6f6); color: #fff; }
  .tile[data-v="32"]  { background: linear-gradient(180deg, #29b6f6, #03a9f4); color: #fff; }
  .tile[data-v="64"]  { background: linear-gradient(180deg, #03a9f4, #0288d1); color: #fff; }
  .tile[data-v="128"] { background: linear-gradient(180deg, #0288d1, #0277bd); color: #fff; font-size: clamp(1.3rem, 4.8vmin, 2.6rem); }
  .tile[data-v="256"] { background: linear-gradient(180deg, #0277bd, #01579b); color: #fff; font-size: clamp(1.3rem, 4.8vmin, 2.6rem); }
  .tile[data-v="512"] { background: linear-gradient(180deg, #0277bd, #01579b); color: #fff; font-size: clamp(1.3rem, 4.8vmin, 2.6rem); }
  .tile[data-v="1024"] { background: linear-gradient(180deg, #fff9c4, #ffd600); color: var(--deep); font-size: clamp(1rem, 4vmin, 2.1rem); }
  .tile[data-v="2048"] { background: linear-gradient(180deg, #ffd600, #ffb300); color: var(--deep); font-size: clamp(1rem, 4vmin, 2.1rem); box-shadow: 0 0 24px rgba(255, 214, 0, .6), inset 0 1px 0 #fff; }
  .tile[data-v="4096"], .tile[data-v="8192"] { background: linear-gradient(180deg, #a5d6a7, #66bb6a); color: #fff; font-size: clamp(1rem, 4vmin, 2.1rem); box-shadow: 0 0 30px rgba(165, 214, 167, .6), inset 0 1px 0 #fff; }
  .tile[data-v="16384"], .tile[data-v="32768"], .tile[data-v="65536"] { background: linear-gradient(180deg, #4fc3f7, #0288d1); color: #fff; font-size: clamp(.8rem, 3.4vmin, 1.7rem); }

  .msg {
    position: absolute; inset: 0; display: grid; place-items: center; z-index: 10;
    background: radial-gradient(ellipse 60% 50% at 50% 40%, rgba(6,51,79,.35), transparent 75%);
  }
  .msg > * { pointer-events: auto; }
  .msg[hidden] { display: none; }
  .msg__card {
    padding: 1.5rem 2rem; border-radius: 18px; text-align: center;
    background: linear-gradient(180deg, rgba(255,255,255,.94), var(--glass-mid));
    border: 1px solid var(--hairline-strong);
    box-shadow: var(--shadow-panel), var(--shadow-lift);
    animation: msg-pop 300ms cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes msg-pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .msg__title { font-size: 1.8rem; font-weight: 700; margin: 0 0 .5rem; color: var(--deep); }
  .msg__score { font-size: 1.2rem; margin: .3rem 0 1rem; color: var(--ink-soft); }

  .btn {
    padding: .55rem 1.2rem; border-radius: var(--pill); border: 1px solid rgba(255,255,255,.92);
    background: var(--shine); color: var(--deep); font: inherit; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 10px rgba(1,87,155,.2), inset 0 1px 0 #fff;
  }
  .btn--primary { background: var(--shine-on); color: #fff; }
  .btn--small { padding: .2rem .7rem; font-size: .82rem; font-weight: 600; min-height: 2.1rem; box-sizing: border-box; }
  .btn:hover { filter: brightness(1.06); }
  .btn:focus-visible { outline: 2px solid var(--deep); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .board::after { animation: none; opacity: .7; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="hud">
      <div class="hud__group">
        <span>Score <b id="score">0</b></span>
      </div>
      <div class="hud__group">
        <span>Best <b id="best">0</b></span>
      </div>
      <button class="btn btn--small" id="reset-btn" type="button" title="New game">New Game</button>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="2040 game board"></div>
      <div class="msg" id="msg-win" hidden>
        <div class="msg__card">
          <h2 class="msg__title">You reached 2048!</h2>
          <p class="msg__score">Score: <b id="win-score">0</b></p>
          <button class="btn btn--primary" id="btn-continue" type="button">Keep going</button>
          <button class="btn" id="btn-restart-win" type="button" style="margin-left:.5rem">Restart</button>
        </div>
      </div>
      <div class="msg" id="msg-over" hidden>
        <div class="msg__card">
          <h2 class="msg__title">Game Over</h2>
          <p class="msg__score">Score: <b id="over-score">0</b></p>
          <button class="btn btn--primary" id="btn-restart-over" type="button">Try Again</button>
        </div>
      </div>
    </div>

    <div class="hud" style="justify-content:center; background:none; box-shadow:none; padding:0">
      <span class="hud__dim">Arrow keys / WASD / Swipe to move</span>
    </div>
  </div>

<script type="module">
  const SIZE = 4;
  const WIN_VALUE = 2048;
  const STORAGE_KEY = 'twenty-forty-state';

  function emptyGrid() { return Array.from({ length: SIZE }, () => Array(SIZE).fill(0)); }
  function cloneGrid(g) { return g.map(row => [...row]); }

  function addRandomTile(grid) {
    const empties = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (grid[r][c] === 0) empties.push([r, c]);
    if (!empties.length) return false;
    const [r, c] = empties[Math.floor(Math.random() * empties.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    return [r, c];
  }

  // Slide a row/col array of objects {v, idx}. Returns { newVals, score, moved, merges, result }
  function slideLine(line, towardsStart) {
    // line: array of {v, idx} where idx is original position
    // towardsStart: true = left/up, false = right/down
    const tiles = line.filter(t => t.v !== 0);
    const result = Array(SIZE).fill(null);
    let score = 0;
    const merges = [];

    let writePos = towardsStart ? 0 : SIZE - 1;
    const step = towardsStart ? 1 : -1;

    for (let i = 0; i < tiles.length; i++) {
      const curr = tiles[i];
      const next = tiles[i + 1];
      if (next && curr.v === next.v) {
        // Merge
        result[writePos] = { v: curr.v * 2, merged: true, fromIdx: curr.idx };
        score += curr.v * 2;
        merges.push({ fromIdx: curr.idx, toIdx: writePos, value: curr.v * 2 });
        i++; // skip next
      } else {
        // No merge
        result[writePos] = { v: curr.v, merged: false, fromIdx: curr.idx };
      }
      writePos += step;
    }

    // Convert back to plain values
    const newVals = result.map(t => t ? t.v : 0);
    const moved = JSON.stringify(newVals) !== JSON.stringify(line.map(t => t.v));
    return { newVals, score, moved, merges, result };
  }

  // Move the grid. Returns { grid, score, moved, tileMoves, newTiles }
  function move(grid, direction) {
    const newGrid = cloneGrid(grid);
    let totalScore = 0;
    let moved = false;
    const tileMoves = [];
    const newTilePos = [];

    if (direction === 'left' || direction === 'right') {
      const towardsStart = direction === 'left';
      for (let r = 0; r < SIZE; r++) {
        const line = newGrid[r].map((v, c) => v !== 0 ? {v, idx: c} : null).filter(Boolean);
        const { newVals, score, moved: lineMoved, merges, result } = slideLine(line, towardsStart);

        // Track moves for non-merged tiles
        let readIdx = 0;
        for (let c = 0; c < SIZE; c++) {
          if (!result[c]) continue; // empty
          const item = result[c];
          if (!item.merged) {
            const old = line[readIdx++];
            if (old) {
              tileMoves.push({ from: [r, old.idx], to: [r, c], value: old.v, merged: false });
            }
          }
        }
        // Merged tiles - source tile vanishes, destination pops
        for (const m of merges) {
          tileMoves.push({ from: [r, m.fromIdx], to: [r, m.toIdx], value: m.value / 2, merged: true });
        }

        for (let c = 0; c < SIZE; c++) newGrid[r][c] = result[c] ? result[c].v : 0;
        totalScore += score; moved = moved || lineMoved;
      }
    } else {
      const towardsStart = direction === 'up';
      for (let c = 0; c < SIZE; c++) {
        const colVals = newGrid.map((row, r) => ({ v: row[c], idx: r })).filter(t => t.v !== 0);
        const { newVals, score, moved: colMoved, merges, result } = slideLine(colVals, towardsStart);

        let readIdx = 0;
        for (let r = 0; r < SIZE; r++) {
          if (!result[r]) continue;
          const item = result[r];
          if (!item.merged) {
            const old = colVals[readIdx++];
            if (old) {
              tileMoves.push({ from: [old.idx, c], to: [r, c], value: old.v, merged: false });
            }
          }
        }
        for (const m of merges) {
          tileMoves.push({ from: [m.fromIdx, c], to: [m.toIdx, c], value: m.value / 2, merged: true });
        }

        for (let r = 0; r < SIZE; r++) newGrid[r][c] = result[r] ? result[r].v : 0;
        totalScore += score; moved = moved || colMoved;
      }
    }

    // Find new tile positions (where old was 0 and new is non-zero)
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === 0 && newGrid[r][c] !== 0) newTilePos.push([r, c]);
    }

    return { grid: newGrid, score: totalScore, moved, tileMoves, newTiles: newTilePos };
  }

  function hasMoves(grid) {
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      if (grid[r][c] === 0) return true;
      if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return true;
      if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return true;
    }
    return false;
  }

  function maxTile(grid) { return Math.max(...grid.flat()); }

  let grid = emptyGrid();
  let score = 0;
  let best = Number(localStorage.getItem('twenty-forty-best') || 0);
  let won = false;
  let gameOver = false;
  let animating = false;
  const tileElements = new Map(); // "r,c" -> tile element

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const msgWin = document.getElementById('msg-win');
  const msgOver = document.getElementById('msg-over');
  const winScoreEl = document.getElementById('win-score');
  const overScoreEl = document.getElementById('over-score');

  function cellRect(r, c) {
    const cell = boardEl.querySelector('.cell[style*="grid-row: ' + (r + 1) + '"][style*="grid-column: ' + (c + 1) + '"]');
    if (!cell) return null;
    const boardRect = boardEl.getBoundingClientRect();
    const cellRect_ = cell.getBoundingClientRect();
    return { top: cellRect_.top - boardRect.top, left: cellRect_.left - boardRect.left, width: cellRect_.width, height: cellRect_.height };
  }

  function createTile(r, c, value, isNew, isMerged) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.v = value;
    tile.textContent = value;
    if (isNew) tile.classList.add('tile--new');
    if (isMerged) tile.classList.add('tile--merged');
    const rect = cellRect(r, c);
    if (rect) { tile.style.top = rect.top + 'px'; tile.style.left = rect.left + 'px'; tile.style.width = rect.width + 'px'; tile.style.height = rect.height + 'px'; }
    tile.style.gridRow = r + 1;
    tile.style.gridColumn = c + 1;
    return tile;
  }

  function render(immediate) {
    const newTileElements = new Map();

    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
      const v = grid[r][c];
      if (v === 0) continue;
      const key = r + ',' + c;
      const existing = tileElements.get(key);

      if (existing && !immediate) {
        const rect = cellRect(r, c);
        if (rect) { existing.style.top = rect.top + 'px'; existing.style.left = rect.left + 'px'; }
        existing.style.gridRow = r + 1;
        existing.style.gridColumn = c + 1;
        newTileElements.set(key, existing);
      } else {
        const tile = createTile(r, c, v, false, false);
        boardEl.appendChild(tile);
        newTileElements.set(key, tile);
      }
    }

    for (const [key, tile] of tileElements) {
      if (!newTileElements.has(key)) tile.remove();
    }

    tileElements.clear();
    for (const [key, tile] of newTileElements) tileElements.set(key, tile);

    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function animateMove(moveInfo) {
    return new Promise(function(resolve) {
      const from = moveInfo.from;
      const to = moveInfo.to;
      const merged = moveInfo.merged;
      const fromKey = from[0] + ',' + from[1];
      const tile = tileElements.get(fromKey);

      if (!tile) { resolve(); return; }

      const rect = cellRect(to[0], to[1]);
      if (!rect) { resolve(); return; }

      tile.style.transition = 'transform var(--move-duration) var(--ease), opacity var(--move-duration) var(--ease)';
      tile.style.top = rect.top + 'px';
      tile.style.left = rect.left + 'px';

      if (merged) {
        tile.classList.add('tile--merged-from');
        tile.addEventListener('animationend', function() { tile.remove(); resolve(); }, { once: true });
      } else {
        tile.style.gridRow = to[0] + 1;
        tile.style.gridColumn = to[1] + 1;
        tile.addEventListener('transitionend', function() { resolve(); }, { once: true });
      }
    });
  }

  async function doMove(dir) {
    if (gameOver || animating) return;
    const result = move(grid, dir);
    if (!result.moved) return;

    animating = true;
    grid = result.grid;
    score += result.score;
    save();

    await Promise.all(result.tileMoves.map(function(m) { return animateMove(m); }));

    for (const pos of result.newTiles) {
      const r = pos[0], c = pos[1];
      const tile = createTile(r, c, grid[r][c], true, false);
      boardEl.appendChild(tile);
      tileElements.set(r + ',' + c, tile);
    }

    render(true);
    animating = false;

    checkWin();
    if (!hasMoves(grid)) { gameOver = true; save(); showOver(); }
  }

  function init() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const state = JSON.parse(saved);
        grid = state.grid; score = state.score; won = state.won; gameOver = state.gameOver;
      } catch { reset(); }
    } else { reset(); }
    render(true);
  }

  function reset() {
    grid = emptyGrid(); score = 0; won = false; gameOver = false;
    tileElements.clear();
    addRandomTile(grid); addRandomTile(grid);
    save();
    render(true);
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ grid, score, won, gameOver }));
    if (score > best) { best = score; localStorage.setItem('twenty-forty-best', String(best)); }
  }

  function checkWin() {
    if (!won && maxTile(grid) >= WIN_VALUE) { won = true; save(); showWin(); }
  }

  function showWin() { winScoreEl.textContent = score; msgWin.hidden = false; }
  function showOver() { overScoreEl.textContent = score; msgOver.hidden = false; }

  document.addEventListener('keydown', function(e) {
    const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right' };
    if (map[e.code]) { e.preventDefault(); doMove(map[e.code]); }
  });

  let touchStart = null;
  boardEl.addEventListener('touchstart', function(e) { touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }, { passive: true });
  boardEl.addEventListener('touchend', function(e) {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) > Math.abs(dy)) { if (Math.abs(dx) > 20) doMove(dx > 0 ? 'right' : 'left'); }
    else { if (Math.abs(dy) > 20) doMove(dy > 0 ? 'down' : 'up'); }
  }, { passive: true });

  document.getElementById('btn-continue').onclick = function() { msgWin.hidden = true; };
  document.getElementById('btn-restart-win').onclick = function() { msgWin.hidden = true; reset(); render(true); };
  document.getElementById('btn-restart-over').onclick = function() { msgOver.hidden = true; reset(); render(true); };
  document.getElementById('reset-btn').onclick = function() { reset(); render(true); };

  init();
</script>
</body>
</html>
