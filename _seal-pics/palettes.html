<!doctype html><meta charset=utf-8><style>
body{margin:0;background:#0a2231;color:#eaf6ff;font:15px/1.3 "Segoe UI",system-ui,sans-serif;
display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:16px}
figure{margin:0;display:grid;gap:5px;text-align:center}
.chip{height:150px;border-radius:12px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.35)}
.sun{position:absolute;right:14%;top:12%;width:34px;height:34px;border-radius:50%;filter:blur(1px)}
.deep{position:absolute;left:0;right:0;bottom:0;height:38%}
figure b{font-size:14px} figure span{font-size:12px;opacity:.7}
